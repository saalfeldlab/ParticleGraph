description: LLM-guided pattern exploration
dataset: diffusiophoresis_Claude
simulation:
  params:
    # Iter 93: Block 12, iter 5/8. Parent=87 (Da_c=10 labyrinthine).
    # Strategy: exploit — Da_c=7 fine-mapping between network (5) and labyrinthine (10).
    # Question: Does Da_c=7 produce a clean labyrinthine/stripe mode?
    # Da_c=5 -> coarse Voronoi network (requires 2-type), Da_c=10 -> mixed labyrinthine
    # Da_c=15 -> hex spots. Da_c=7 should be intermediate between network and labyrinthine.
    # 2-type opposing mobility (required for low Da_c stability, confirmed iter 86)
    # Brusselator: A=4.5, B=6.5 (hex regime), Da_c=7
    # Params: [M1, M2, consumption, production, ar_p1, ar_p2, ar_p3, ar_p4]
    - - -4
      - 4
      - 180
      - -180
      - 1.6
      - 1.0
      - 1.6
      - 1.5
    - - 4
      - -4
      - -180
      - 180
      - 1.8
      - 1.0
      - 1.1
      - 1.9
  params_mesh:
    # Brusselator row 0: [D1=1.0, Da_c=7, A=4.5, B=6.5, mu=0, ...]
    # Da_c=7 — intermediate between network (5) and labyrinthine (10)
    - - 1.0
      - 7
      - 4.5
      - 6.5
      - 0
      - 0
    # Brusselator row 1: [D2=6.0, ...] standard diffusion ratio
    - - 6.0
      - 0
      - 0
      - 0
      - 0
      - 0
    # Row 2: Particle-field coupling [Pe=1.0, consumption=180, production=-180, influence=0.05, ...]
    - - 1.0
      - 180
      - -180
      - 0.05
      - 0
      - 0
  min_radius: 0
  max_radius: 0.2
  n_particles: 9600
  n_particle_types: 2
  n_frames: 6000
  n_nodes: 10000
  n_node_types: 1
  sigma: 0.005
  delta_t: 0.0005
  dpos_init: 0
  boundary: "periodic"
  shuffle_particle_types: False
  node_value_map: input_data/pattern_Null.tif
  node_coeff_map: ""
graph_model:
  field_type: diffusiophoresis
  particle_model_name: PDE_ParticleField_D
  mesh_model_name: Diffusiophoresis_Mesh
  prediction: first_derivative
  input_size: 5
  output_size: 2
  hidden_dim: 128
  n_layers: 5
  aggr_type: mean
  embedding_dim: 2
  update_type: none
plotting:
  colormap: tab10
  arrow_length: 2
  ylim:
    - -0.04
    - 0.03
training:
  n_runs: 1
  device: cuda:1
  n_epochs: 20
  batch_size: 8
  small_init_batch_size: false
  sparsity: replace_embedding_function
  cluster_method: distance_plot
  rotation_augmentation: true
  data_augmentation_loop: 100
  fix_cluster_embedding: true
claude:
  n_iter_block: 8
  ucb_c: 1.414
